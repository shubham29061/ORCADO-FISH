<!DOCTYPE html>
<html>
<head>
  <title>Add Boat</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
  <img src="logo.png">
  <div>
    <a href="index.html">Home</a>
    <a href="add-boat.html">Add Boat</a>
    <a href="view-boats.html">View Boats</a>
  </div>
</nav>

<section class="section">
  <h2>Add Boat</h2>

  <form id="boatForm">

    <input id="boatName" placeholder="Boat Name" required>
    <input id="location" placeholder="Location" required>
    <input id="ownerName" placeholder="Boat Owner Name">
    <input id="regNumber" placeholder="Boat Registration Number">
    <input id="mobile" placeholder="Mobile Number">
    <input id="email" placeholder="Email ID">

    <select id="subscription">
      <option value="Active">Active</option>
      <option value="Expired">Expired</option>
    </select>

    <button type="submit">Save Boat</button>

  </form>
</section>

<script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-firestore.js"></script>
<script src="app.js"></script>

</body>
</html>
