<!DOCTYPE html>
<html>
<head>
<title>Orcado Fish</title>

<style>
body {
    font-family: Arial;
    background-color: #b3e5fc;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 0;
}

.container {
    background: white;
    padding: 25px;
    width: 100%;
    max-width: 500px;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
}

h2 {
    text-align: center;
    margin-bottom: 20px;
}

label {
    font-weight: bold;
    display: block;
    margin-top: 10px;
}

input, select, button {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    border-radius: 5px;
    border: 1px solid #ccc;
    box-sizing: border-box;
}

button {
    margin-top: 20px;
    background-color: #007BFF;
    color: white;
    border: none;
    cursor: pointer;
    font-size: 16px;
}

button:hover {
    background-color: #0056b3;
}

#status {
    text-align: center;
    margin-top: 10px;
    color: green;
}

/* logo */
.logo-box {
    text-align: center;
    margin-bottom: 15px;
}

.logo-box img {
    width: 120px;
}

/* View Data Section */
.table-box {
    margin-top: 25px;
    background: #e3f2fd;
    padding: 15px;
    border-radius: 10px;
}

.table-box h3 {
    margin-bottom: 10px;
    text-align: center;
}

#searchBox {
    width: 100%;
    padding: 8px;
    margin-bottom: 8px;
    border-radius: 6px;
    border: 1px solid #888;
}

table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
}

th, td {
    border: 1px solid #aaa;
    padding: 6px;
    text-align: left;
}

th {
    background: #1976d2;
    color: white;
}

.status-badge {
    padding: 4px 8px;
    border-radius: 6px;
    font-weight: bold;
}

.active {
    background:#c8f7c5;
    color:#1b5e20;
}

.expired {
    background:#ffcdd2;
    color:#b71c1c;
}
</style>
</head>


<body>

<div class="container">

<!-- LOGO -->
<div class="logo-box">
    <img src="logo.png" alt="Orcado Fish Logo">
</div>

<h2>Orcado Fish — Add Boat</h2>

<form id="boatForm">

    <label>Boat Name</label>
    <input type="text" id="boatName" required>

    <label>Location</label>
    <input type="text" id="location" required>

    <label>Boat Owner Name</label>
    <input type="text" id="ownerName" required>

    <label>Boat Registration Number</label>
    <input type="text" id="registrationNumber" required>

    <label>Mobile No</label>
    <input type="tel" id="mobile" required>

    <label>Email ID</label>
    <input type="email" id="email" required>

    <label>Subscription Active</label>
    <select id="subscriptionActive" required>
        <option value="">Select</option>
        <option value="Yes">Yes</option>
        <option value="No">No</option>
    </select>

    <label>Subscription Finish Date</label>
    <input type="date" id="finishDate">

    <label>Wireless No</label>
    <input type="text" id="wirelessNo">

    <button type="submit">Submit</button>

    <p id="status"></p>
</form>



<!-- 🔹 VIEW DATA SECTION -->
<div class="table-box">

  <h3>View Boat Data</h3>

  <input type="text" id="searchBox" placeholder="Search boats, owner, location...">

  <button onclick="exportTableToExcel('boatTable','boats_data')">
    Export to Excel
  </button>

  <table id="boatTable">
      <thead>
          <tr>
              <th>Boat Name</th>
              <th>Owner</th>
              <th>Location</th>
              <th>Mobile</th>
              <th>Subscription</th>
              <th>Expiry</th>
          </tr>
      </thead>
      <tbody></tbody>
  </table>
</div>



<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<!-- Excel Export Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>


<script>

const firebaseConfig = {
    apiKey: "AIzaSyBgHSbR6Q_za_uSjxpNwfPGh2xx4QSYpEY",
    authDomain: "orcadofish.firebaseapp.com",
    databaseURL: "https://orcadofish-default-rtdb.firebaseio.com",
    projectId: "orcadofish",
    storageBucket: "orcadofish.firebasestorage.app",
    messagingSenderId: "138005449504",
    appId: "1:138005449504:web:897c9d263541ec1a926545",
    measurementId: "G-3QR55DB06K"
};

firebase.initializeApp(firebaseConfig);
var database = firebase.database();


// 🔹 SAVE DATA
document.getElementById("boatForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const data = {
        boatName: boatName.value.trim(),
        location: location.value.trim(),
        ownerName: ownerName.value.trim(),
        registrationNumber: registrationNumber.value.trim(),
        mobile: mobile.value.trim(),
        email: email.value.trim(),
        subscriptionActive: subscriptionActive.value,
        finishDate: finishDate.value,
        wirelessNo: wirelessNo.value.trim()
    };

    // validation
    for (const v in data) if (!data[v]) {
        status.style.color = "red";
        status.innerHTML = "❌ Please fill ALL fields";
        return;
    }

    database.ref("boats").push(data);

    status.style.color = "green";
    status.innerHTML = "✅ Data Saved Successfully";
    this.reset();
});



// =========================
// 🔹 VIEW DATA FUNCTIONS
// =========================

const tableBody = document.querySelector("#boatTable tbody");
const searchBox = document.getElementById("searchBox");

let boatsData = [];

function getSubscriptionStatus(dateStr){
    if(!dateStr) return "Expired";

    const today = new Date();
    const exp = new Date(dateStr);

    return exp >= today ? "Active" : "Expired";
}


// 🔹 LOAD DATA
database.ref("boats").on("value", snapshot => {

    boatsData = [];
    tableBody.innerHTML = "";

    snapshot.forEach(child => {
        const b = child.val();
        boatsData.push(b);
    });

    renderTable(boatsData);
});


// 🔹 RENDER TABLE
function renderTable(data){

    tableBody.innerHTML = "";

    data.forEach(b => {

        const status = getSubscriptionStatus(b.finishDate);

        const row = `
        <tr>
            <td>${b.boatName}</td>
            <td>${b.ownerName}</td>
            <td>${b.location}</td>
            <td>${b.mobile}</td>

            <td>
              <span class="status-badge ${status === 'Active' ? 'active':'expired'}">
                ${status}
              </span>
            </td>

            <td>${b.finishDate || "-"}</td>
        </tr>`;

        tableBody.innerHTML += row;
    });
}



// 🔍 LIVE SEARCH FILTER
searchBox.addEventListener("keyup", function(){

    const q = this.value.toLowerCase();

    const filtered = boatsData.filter(b =>
        (b.boatName || "").toLowerCase().includes(q) ||
        (b.ownerName || "").toLowerCase().includes(q) ||
        (b.location || "").toLowerCase().includes(q) ||
        (b.mobile || "").toLowerCase().includes(q)
    );

    renderTable(filtered);
});



// 📤 EXPORT TO EXCEL
function exportTableToExcel(tableID, filename="boats_data") {

    const wb = XLSX.utils.table_to_book(
        document.getElementById(tableID)
    );

    XLSX.writeFile(wb, filename + ".xlsx");
}

</script>

</div>
</body>
</html>
