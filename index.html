<!DOCTYPE html>
<html>
<head>
<title>Orcado Fish</title>

<style>
body {
    font-family: Arial;
    background-color: #b3e5fc;
    margin: 0;
}

/* Section Wrapper */
.section {
    max-width: 900px;
    margin: 25px auto;
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
}

/* Headings */
h2, h3 {
    text-align: center;
    margin-top: 0;
}

/* Logo */
.logo-box {
    text-align: center;
    margin-bottom: 10px;
}
.logo-box img {
    width: 130px;
}

/* Form Styles */
label {
    font-weight: bold;
    display: block;
    margin-top: 10px;
}
input, select, button {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    border-radius: 6px;
    border: 1px solid #ccc;
    box-sizing: border-box;
}
button {
    margin-top: 15px;
    background:#007bff;
    color:white;
    border:none;
    cursor:pointer;
}
button:hover {
    background:#0056b3;
}
#status {
    text-align:center;
    margin-top:8px;
}

/* TABLE SECTION */
.table-controls {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
}
#searchBox {
    flex: 1;
    padding: 8px;
    border-radius: 6px;
    border: 1px solid #666;
}

table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
}
th, td {
    border: 1px solid #bbb;
    padding: 6px;
}
th {
    background:#1976d2;
    color:white;
}

/* STATUS BADGES */
.status-badge {
    padding: 4px 8px;
    border-radius: 6px;
    font-weight: bold;
}
.active {
    background:#c8f7c5;
    color:#1b5e20;
}
.expired {
    background:#ffcdd2;
    color:#b71c1c;
}
</style>
</head>


<body>


<!-- ========== SECTION 1 : ADD BOAT ========== -->
<div class="section">

<div class="logo-box">
    <img src="logo.png">
</div>

<h2>Orcado Fish — Add Boat</h2>

<form id="boatForm">

    <label>Boat Name</label>
    <input type="text" id="boatName" required>

    <label>Location</label>
    <input type="text" id="location" required>

    <label>Boat Owner Name</label>
    <input type="text" id="ownerName" required>

    <label>Boat Registration Number</label>
    <input type="text" id="registrationNumber" required>

    <label>Mobile No</label>
    <input type="tel" id="mobile" required>

    <label>Email ID</label>
    <input type="email" id="email" required>

    <label>Subscription Active</label>
    <select id="subscriptionActive" required>
        <option value="">Select</option>
        <option value="Yes">Yes</option>
        <option value="No">No</option>
    </select>

    <label>Subscription Finish Date</label>
    <input type="date" id="finishDate">

    <label>Wireless No</label>
    <input type="text" id="wirelessNo">

    <button type="submit">Save Boat</button>

    <p id="status"></p>
</form>
</div>



<!-- ========== SECTION 2 : VIEW / SEARCH / EXPORT ========== -->
<div class="section">

<h3>Boat Records — View / Search / Export</h3>

<div class="table-controls">
    <input id="searchBox" placeholder="Search boat / owner / location / mobile...">
    <button onclick="exportTableToExcel('boatTable','boats_data')">
        Export to Excel
    </button>
</div>

<table id="boatTable">
    <thead>
        <tr>
            <th>Boat</th>
            <th>Owner</th>
            <th>Location</th>
            <th>Mobile</th>
            <th>Subscription</th>
            <th>Expiry</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

</div>



<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<!-- Excel Export -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>


<script>
const firebaseConfig = {
    apiKey: "AIzaSyBgHSbR6Q_za_uSjxpNwfPGh2xx4QSYpEY",
    authDomain: "orcadofish.firebaseapp.com",
    databaseURL: "https://orcadofish-default-rtdb.firebaseio.com",
    projectId: "orcadofish",
    storageBucket: "orcadofish.firebasestorage.app",
    messagingSenderId: "138005449504",
    appId: "1:138005449504:web:897c9d263541ec1a926545"
};

firebase.initializeApp(firebaseConfig);
var database = firebase.database();


// SAVE DATA
document.getElementById("boatForm").addEventListener("submit", e => {
    e.preventDefault();

    const data = {
        boatName: boatName.value.trim(),
        location: location.value.trim(),
        ownerName: ownerName.value.trim(),
        registrationNumber: registrationNumber.value.trim(),
        mobile: mobile.value.trim(),
        email: email.value.trim(),
        subscriptionActive: subscriptionActive.value,
        finishDate: finishDate.value,
        wirelessNo: wirelessNo.value.trim()
    };

    for (const k in data) {
        if (!data[k]) {
            status.style.color = "red";
            status.innerHTML = "❌ Please fill ALL fields";
            return;
        }
    }

    database.ref("boats").push(data);

    status.style.color = "green";
    status.innerHTML = "✅ Boat Saved Successfully";
    e.target.reset();
});



// LOAD + DISPLAY DATA
const tableBody = document.querySelector("#boatTable tbody");
let boatsData = [];

function getSubscriptionStatus(dateStr){
    if (!dateStr) return "Expired";
    return new Date(dateStr) >= new Date() ? "Active" : "Expired";
}

database.ref("boats").on("value", snap => {

    boatsData = [];
    tableBody.innerHTML = "";

    snap.forEach(child => boatsData.push(child.val()));

    renderTable(boatsData);
});

function renderTable(data){

    tableBody.innerHTML = "";

    data.forEach(b => {
        const status = getSubscriptionStatus(b.finishDate);

        tableBody.innerHTML += `
        <tr>
            <td>${b.boatName}</td>
            <td>${b.ownerName}</td>
            <td>${b.location}</td>
            <td>${b.mobile}</td>
            <td>
                <span class="status-badge ${status === 'Active' ? 'active':'expired'}">
                    ${status}
                </span>
            </td>
            <td>${b.finishDate || "-"}</td>
        </tr>`;
    });
}



// SEARCH FILTER
searchBox.addEventListener("keyup", e => {

    const q = e.target.value.toLowerCase();

    const filtered = boatsData.filter(b =>
        (b.boatName||"").toLowerCase().includes(q) ||
        (b.ownerName||"").toLowerCase().includes(q) ||
        (b.location||"").toLowerCase().includes(q) ||
        (b.mobile||"").toLowerCase().includes(q)
    );

    renderTable(filtered);
});



// EXPORT TO EXCEL
function exportTableToExcel(tableID, filename="boats_data"){
    const wb = XLSX.utils.table_to_book(
        document.getElementById(tableID)
    );
    XLSX.writeFile(wb, filename + ".xlsx");
}
</script>

</body>
</html>
